name: CI & Quality Gates

on:
  push:
    branches: ["main", "develop"]
  pull_request:
    branches: ["main", "develop"]

jobs:
  quality-gate:
    name: Test, Typecheck & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Setup Python (para rastreabilidade SDD)
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: npm ci

      - name: Type Check (TypeScript)
        run: npx tsc --noEmit

      - name: Unit Tests (Vitest)
        run: npm run test

      - name: Production Build (Vite)
        run: npm run build

      - name: Check SDD Traceability Matrix
        run: python3 scripts/generate_traceability.py
